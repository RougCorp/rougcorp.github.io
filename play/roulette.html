<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prototype roulette — Swing & Snap</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Bagel+Fat+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{font-family:'Nunito',sans-serif;background:radial-gradient(130% 90% at 50% 0%,#FBF7F0,#EFE6D8);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));overflow:hidden;color:#4A3728}
/* HUD coins */
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px;z-index:20;pointer-events:none}
.hud>*{pointer-events:auto;display:flex;gap:8px}
.icobtn{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 3px 11px rgba(60,40,25,.16);display:flex;align-items:center;justify-content:center;font-size:1.15rem;cursor:pointer;border:1.5px solid rgba(0,0,0,.05)}
.icobtn:active{transform:scale(.9)}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border-radius:22px;padding:8px 13px;font-weight:900;font-size:.85rem;box-shadow:0 3px 11px rgba(60,40,25,.16);color:#4A3728}
.gem-d{width:11px;height:11px;transform:rotate(45deg);border-radius:2px}
/* wrap */
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:min(2vh,14px);margin-top:min(6vh,40px)}
h1{font-family:'Bagel Fat One',cursive;font-weight:400;font-size:clamp(2rem,9vw,2.7rem);letter-spacing:0;line-height:1.02;text-align:center;color:#74822E;
  text-shadow:0 3px 0 rgba(80,92,28,.24),0 6px 12px rgba(60,70,20,.28);animation:titleIn .62s cubic-bezier(.2,1.65,.4,1) both}
h1 .amp{color:#8E63B4}
@keyframes titleIn{0%{opacity:0;transform:scale(.5) translateY(-14px)}68%{transform:scale(1.09)}100%{opacity:1;transform:none}}
/* bandeau pseudo */
.namebar{display:flex;align-items:center;gap:9px;width:100%;max-width:400px;background:linear-gradient(135deg,#EDE7F6,#E3F2FD);border:1.5px solid rgba(126,87,194,.30);border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 10px rgba(74,55,40,.06)}
.namebar .ic{font-size:1.3rem}
.namebar .tx{flex:1;text-align:left;font-size:.82rem;font-weight:800;color:#5B4636;line-height:1.2}
.namebar .ar{font-size:1.15rem;color:#9A8574;font-weight:900}
.namebar.set{background:linear-gradient(135deg,#E8F5E9,#E3F2FD);border-color:rgba(67,160,71,.4)}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(9px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.shake{animation:shake .5s}
/* carousel */
.stage{position:relative;width:100%;height:min(31vh,228px);overflow:hidden;touch-action:pan-y}
.track{position:absolute;top:0;left:50%;height:100%;display:flex;align-items:center;gap:18px;will-change:transform;transition:transform .42s cubic-bezier(.22,1,.3,1)}
.card{position:relative;flex:0 0 224px;height:100%;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(1.3vh,9px);color:#fff;
  box-shadow:0 14px 28px rgba(60,40,25,.26),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .42s cubic-bezier(.22,1,.3,1),opacity .42s,filter .42s;transform:scale(.82);opacity:.5;filter:saturate(.85)}
.card.active{transform:scale(1);opacity:1;filter:none}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% -10%,rgba(255,255,255,.4),rgba(255,255,255,0) 55%);pointer-events:none}
.lock{position:absolute;top:10px;right:10px;font-size:.62rem;font-weight:900;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:3px 9px;display:none;align-items:center;gap:3px}
.card.needname .lock{display:flex}
.medallion{width:min(10.5vh,80px);height:min(10.5vh,80px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:min(5.6vh,2.7rem);
  background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.6),rgba(255,255,255,.12) 60%,rgba(0,0,0,.08));box-shadow:inset 0 3px 8px rgba(255,255,255,.5),inset 0 -6px 14px rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.16)}
.c-name{font-size:1.45rem;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 4px rgba(0,0,0,.22)}
.c-desc{font-size:.78rem;font-weight:800;line-height:1.26;text-align:center;padding:0 20px;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.c-stat{font-size:.74rem;font-weight:900;letter-spacing:.4px;padding:5px 13px;border-radius:20px;background:rgba(0,0,0,.20);border:1.5px solid rgba(255,255,255,.35);color:#fff}
/* arrows */
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.92);
  box-shadow:0 5px 14px rgba(60,40,25,.22);font-size:1.5rem;font-weight:900;color:#6A4C93;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.arrow:active{transform:translateY(-50%) scale(.9)}
.arrow.l{left:4px}.arrow.r{right:4px}
/* dots */
.dots{display:flex;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(74,55,40,.2);transition:.3s;cursor:pointer}
.dot.on{width:24px;border-radius:8px;background:#8E63B4}
/* play */
.play{width:100%;max-width:360px;padding:16px;border:none;border-radius:19px;font-family:inherit;font-weight:900;font-size:1.2rem;letter-spacing:1px;color:#fff;cursor:pointer;
  box-shadow:0 10px 22px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s,background .42s,box-shadow .42s;display:flex;align-items:center;justify-content:center;gap:10px}
.play:active{transform:scale(.97)}
/* secondary : 4 tuiles 2x2 */
.sec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;width:100%;max-width:380px}
.sbtn{height:min(11vh,88px);border:1.5px solid color-mix(in srgb,var(--c) 42%,#fff);border-radius:18px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--c) 13%,#fff));box-shadow:0 4px 11px rgba(74,55,40,.10);display:flex;align-items:center;justify-content:flex-start;gap:13px;padding:0 16px;cursor:pointer;color:var(--c)}
.sbtn .ic{width:min(6.5vh,50px);height:min(6.5vh,50px);flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:min(3.6vh,1.8rem);background:color-mix(in srgb,var(--c) 16%,#fff)}
.sbtn span{font-size:.82rem;font-weight:900;letter-spacing:.3px}
.sbtn:active{transform:scale(.95)}
</style></head>
<body>
<div class="hud">
  <div class="hud-left">
    <div class="icobtn" id="btnStats" title="Stats">📊</div>
    <div class="icobtn" id="btnSettings" title="Réglages">⚙️</div>
  </div>
  <div class="chip"><span class="gem-d" style="background:#F4A926;box-shadow:0 0 6px rgba(244,169,38,.5)"></span>168<span class="gem-d" style="background:#29B6F6;box-shadow:0 0 6px rgba(41,182,246,.5);margin-left:4px"></span>46</div>
</div>
<div class="wrap">
  <h1 id="title">SWING <span class="amp">&amp;</span> SNAP</h1>
  <div class="namebar" id="namebar" role="button">
    <span class="ic" id="nameIc">🏷️</span>
    <span class="tx" id="nameTx">Choisis ton pseudo pour jouer en ligne</span>
    <span class="ar">›</span>
  </div>
  <div class="stage" id="stage">
    <div class="track" id="track"></div>
    <button class="arrow l" id="prev" aria-label="Précédent">‹</button>
    <button class="arrow r" id="next" aria-label="Suivant">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <button class="play" id="play">▶ <span id="playLabel">JOUER</span></button>
  <div class="sec">
    <div class="sbtn" style="--c:#0F8074"><div class="ic">🎨</div><span>COLLECTION</span></div>
    <div class="sbtn" style="--c:#E07B00"><div class="ic">🎯</div><span>MISSIONS</span></div>
    <div class="sbtn" style="--c:#C2185B"><div class="ic">🛍️</div><span>BOUTIQUE</span></div>
    <div class="sbtn" style="--c:#C8860B"><div class="ic">🏆</div><span>CLASSEMENT</span></div>
  </div>
</div>
<script>
const MODES=[
  {key:'classic', name:'Classique', emoji:'🎯', desc:'Enchaîne les pivots sans tomber. Bats ton record.', stat:'🏅 Record : 128', a1:'#A883D0', a2:'#7A4FA0'},
  {key:'duel',    name:'Duels',     emoji:'⚔️', desc:'Affronte d\'autres joueurs en temps réel.',        stat:'🎖️ Ligue Argent', a1:'#8A8DF5', a2:'#4F46C4', needName:true},
  {key:'campaign',name:'Campagne',  emoji:'🗺️', desc:'Traverse les mondes, niveau par niveau.',          stat:'🌍 Monde 1 · 4/12', a1:'#38C3AC', a2:'#0F8074'},
  {key:'blitz',   name:'Blitz',     emoji:'⚡', desc:'Un maximum de points en 60 secondes chrono.',      stat:'⏱️ Record : 74',  a1:'#FF7A7A', a2:'#D62828'},
];
const CW=224,GAP=18,STEP=CW+GAP;
const track=document.getElementById('track'),dots=document.getElementById('dots'),play=document.getElementById('play'),playLabel=document.getElementById('playLabel');
const namebar=document.getElementById('namebar'),nameTx=document.getElementById('nameTx'),nameIc=document.getElementById('nameIc');
let idx=0,playerName='';
MODES.forEach((m,i)=>{
  const c=document.createElement('div');c.className='card'+(m.needName?' needname':'');c.style.background='linear-gradient(160deg,'+m.a1+','+m.a2+')';
  c.innerHTML='<div class="lock">🔒 pseudo requis</div><div class="medallion">'+m.emoji+'</div><div class="c-name">'+m.name+'</div><div class="c-desc">'+m.desc+'</div><div class="c-stat">'+m.stat+'</div>';
  c.addEventListener('click',()=>{ if(i===idx) go(); else set(i); });
  track.appendChild(c);
  const d=document.createElement('div');d.className='dot';d.addEventListener('click',()=>set(i));dots.appendChild(d);
});
const cards=[...track.children],dotEls=[...dots.children];
function render(){
  track.style.transform='translateX('+(-idx*STEP - CW/2)+'px)';
  cards.forEach((c,i)=>c.classList.toggle('active',i===idx));
  cards.forEach((c,i)=>c.classList.toggle('needname',!!(MODES[i].needName&&!playerName)));
  dotEls.forEach((d,i)=>d.classList.toggle('on',i===idx));
  const m=MODES[idx];
  play.style.background='linear-gradient(180deg,'+m.a1+','+m.a2+')';
  play.style.boxShadow='0 10px 22px '+hexA(m.a2,.4)+',inset 0 2px 0 rgba(255,255,255,.35)';
  const locked=m.needName&&!playerName;
  playLabel.textContent=locked?'PSEUDO REQUIS 🔒':'JOUER · '+m.name.toUpperCase();
}
function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function set(i){idx=(i+MODES.length)%MODES.length;render();}
function toast(txt,bg){const t=document.createElement('div');t.textContent=txt;t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:'+(bg||'#2b2b3a')+';color:#fff;padding:11px 20px;border-radius:22px;font-weight:900;font-size:.85rem;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:88vw;text-align:center';document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
function requireName(){namebar.classList.remove('shake');void namebar.offsetWidth;namebar.classList.add('shake');toast('🔒 Choisis d\'abord un pseudo pour jouer en Duel','#C2185B');}
function go(){
  const m=MODES[idx];
  if(m.needName&&!playerName){requireName();return;}
  play.animate([{transform:'scale(1)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:180});
  toast('▶ Lancement : '+m.name);
}
function setName(){
  const v=(prompt('Choisis ton pseudo (max 12) :','')||'').trim().slice(0,12);
  if(!v)return;
  playerName=v;
  namebar.classList.add('set');nameIc.textContent='👤';nameTx.textContent='Connecté : '+playerName+'  ✓';
  render();toast('✅ Pseudo enregistré : '+playerName,'#2E7D32');
}
namebar.addEventListener('click',setName);
document.getElementById('prev').addEventListener('click',()=>set(idx-1));
document.getElementById('next').addEventListener('click',()=>set(idx+1));
play.addEventListener('click',go);
document.getElementById('btnStats').addEventListener('click',()=>toast('📊 Stats (démo)'));
document.getElementById('btnSettings').addEventListener('click',()=>toast('⚙️ Réglages (démo)'));
// swipe / drag (horizontal uniquement)
const stage=document.getElementById('stage');let sx=0,sy=0,dragging=false,moved=0,axis=0;
stage.addEventListener('pointerdown',e=>{dragging=true;sx=e.clientX;sy=e.clientY;moved=0;axis=0;track.style.transition='none';});
window.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!axis&&(Math.abs(dx)>7||Math.abs(dy)>7))axis=Math.abs(dx)>Math.abs(dy)?'h':'v';if(axis!=='h')return;moved=dx;track.style.transform='translateX('+(-idx*STEP-CW/2+moved)+'px)';});
function endDrag(){if(!dragging)return;dragging=false;track.style.transition='';if(axis==='h'&&Math.abs(moved)>50)set(idx+(moved<0?1:-1));else render();}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')set(idx-1);if(e.key==='ArrowRight')set(idx+1);if(e.key==='Enter'||e.key===' ')go();});
render();
</script>
</body></html>
